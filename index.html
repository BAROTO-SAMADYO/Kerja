<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signature Generator by Baroto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-main: #0a0d14;
  --bg-card: rgba(18, 24, 38, 0.75);
  --bg-input: #0e131f;
  --border-color: rgba(255, 255, 255, 0.08);
  --border-focus: #3b82f6;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --accent-cyan: #06b6d4;
  --accent-green: #10b981;
  --accent-purple: #8b5cf6;
  --text-main: #f3f4f6;
  --text-sub: #9ca3af;
  --font-sans: 'Plus Jakarta Sans', sans-serif;
  --font-mono: 'Fira Code', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-sans);
  background: var(--bg-main);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 40px 20px;
  background-image: 
    radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.12) 0%, transparent 40%),
    radial-gradient(circle at 85% 85%, rgba(139, 92, 246, 0.12) 0%, transparent 40%);
}

.wrap {
  width: 100%;
  max-width: 900px;
}

.header {
  margin-bottom: 28px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 16px;
}

.header-title h1 {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.sub {
  color: var(--accent-cyan);
  font-size: 13px;
  font-weight: 600;
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sub::before {
  content: '';
  display: inline-block;
  width: 8px;
  height: 8px;
  background: var(--accent-cyan);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent-cyan);
}

.card {
  background: var(--bg-card);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
  transition: border-color 0.3s ease;
}

.card:hover {
  border-color: rgba(255, 255, 255, 0.15);
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-sub);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

input, textarea {
  width: 100%;
  border: 1px solid var(--border-color);
  background: var(--bg-input);
  color: var(--text-main);
  border-radius: 10px;
  padding: 12px 16px;
  outline: 0;
  font-family: var(--font-mono);
  font-size: 13px;
  transition: all 0.2s ease;
}

input:focus, textarea:focus {
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
}

textarea {
  min-height: 200px;
  resize: vertical;
  line-height: 1.5;
}

.btn {
  border: 0;
  border-radius: 10px;
  padding: 12px 20px;
  background: linear-gradient(135deg, var(--primary) 0%, #2563eb 100%);
  color: #fff;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  margin-top: 16px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}

.btn:hover {
  transform: translateY(-1px);
  box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
}

.btn:active {
  transform: translateY(0);
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-main);
  box-shadow: none;
  border: 1px solid var(--border-color);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.15);
  box-shadow: none;
}

.output-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}

.output {
  min-height: 90px;
  white-space: pre-wrap;
  word-break: break-all;
  font-family: var(--font-mono);
  font-size: 13px;
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 10px;
  padding: 16px;
  color: var(--accent-green);
  line-height: 1.6;
}

.full { grid-column: 1 / -1; }

.status {
  margin-top: 12px;
  font-size: 13px;
  color: var(--accent-cyan);
  font-weight: 500;
}

/* Style Pop-up / Modal Output */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(5, 7, 11, 0.85);
  backdrop-filter: blur(8px);
  justify-content: center;
  align-items: center;
  z-index: 1000;
  opacity: 0;
  transition: opacity 0.3s ease;
}

.modal-overlay.active {
  display: flex;
  opacity: 1;
}

.modal-content {
  background: #121826;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 20px;
  padding: 28px;
  max-width: 650px;
  width: 90%;
  text-align: left;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
  transform: scale(0.95);
  transition: transform 0.3s ease;
}

.modal-overlay.active .modal-content {
  transform: scale(1);
}

.modal-content h3 {
  margin-bottom: 16px;
  color: var(--text-main);
  font-size: 18px;
  font-weight: 700;
}

.modal-buttons {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 20px;
}

@media(max-width: 800px) {
  .grid { grid-template-columns: 1fr; }
  .full { grid-column: auto; }
  body { padding: 20px 12px; }
  .header { flex-direction: column; align-items: flex-start; gap: 8px; }
}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div class="header-title">
      <h1>RSA-SHA256 Signature Generator</h1>
      <div class="sub">Selamat Datang, Tuan Baroto</div>
    </div>
  </div>

  <div class="card grid">
    <div>
      <label for="timestamp">Timestamp</label>
      <input id="timestamp">
    </div>
    <div>
      <label for="clientId">Client ID</label>
      <input id="clientId" value="36feba70-8d05-4cc1-98a8-eefbdb778a14">
    </div>
    <div class="full">
      <label for="privateKey">Private Key</label>
      <textarea id="privateKey" spellcheck="false" placeholder="-----BEGIN RSA PRIVATE KEY-----\n...\n-----END RSA PRIVATE KEY-----"></textarea>
      <button id="run" class="btn">▶ Generate Signature</button>
      <div id="status" class="status"></div>
    </div>
  </div>

  <div class="card">
    <div class="output-header">
      <label>Output Signature (Base64)</label>
      <button id="copy" class="btn btn-secondary" style="margin-top:0; padding:6px 14px; font-size:12px;">Copy Signature</button>
    </div>
    <div id="output" class="output">Belum ada hasil.</div>
  </div>

  <div class="card">
    <label>Data yang ditandatangani</label>
    <div id="data" class="output" style="min-height: auto;">-</div>
  </div>
</div>

<!-- Modal Pop-up Output -->
<div id="popupModal" class="modal-overlay">
  <div class="modal-content">
    <h3>Output Signature (Base64)</h3>
    <div id="popupOutput" class="output"></div>
    <div class="modal-buttons">
      <button id="modalCopy" class="btn">Copy Signature</button>
      <button id="modalClose" class="btn btn-secondary">Tutup</button>
    </div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
function setNow(){
 const d=new Date(); const p=n=>String(n).padStart(2,'0');
 const tz=-d.getTimezoneOffset(), sign=tz>=0?'+':'-', h=p(Math.floor(Math.abs(tz)/60)), m=p(Math.abs(tz)%60);
 $('timestamp').value=`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}${sign}${h}:${m}`;
}
setNow();
function b64ToBytes(b64){const s=atob(b64.replace(/\s+/g,''));const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function pemToDer(pem){return b64ToBytes(pem.replace(/-----BEGIN [^-]+-----/,'').replace(/-----END [^-]+-----/,'').replace(/\s+/g,''))}
function lenBytes(n){if(n<128)return Uint8Array.of(n);let a=[];while(n){a.unshift(n&255);n>>>=8}return Uint8Array.of(0x80|a.length,...a)}
function tlv(tag,body){const l=lenBytes(body.length),o=new Uint8Array(1+l.length+body.length);o[0]=tag;o.set(l,1);o.set(body,1+l.length);return o}
function concat(...xs){const n=xs.reduce((s,x)=>s+x.length,0),o=new Uint8Array(n);let p=0;for(const x of xs){o.set(x,p);p+=x.length}return o}

function pkcs1ToPkcs8(der){
 const rsaOid=tlv(0x06,Uint8Array.from([0x2a,0x86,0x48,0x86,0xf7,0x0d,0x01,0x01,0x01]));
 const algId=tlv(0x30,concat(rsaOid,tlv(0x05,new Uint8Array(0))));
 const version=tlv(0x02,Uint8Array.of(0));
 const octet=tlv(0x04,der);
 return tlv(0x30,concat(version,algId,octet));
}
async function importPrivateKey(pem){
 let der=pemToDer(pem);
 const isPkcs8=/BEGIN PRIVATE KEY/.test(pem);
 if(!isPkcs8) der=pkcs1ToPkcs8(der);
 return crypto.subtle.importKey('pkcs8',der,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['sign']);
}

async function generate(){
 $('status').textContent='';$('output').textContent='Generating...';
 const timestamp=$('timestamp').value.trim(), clientId=$('clientId').value.trim(), pem=$('privateKey').value.trim();
 if(!timestamp||!clientId||!pem)throw new Error('Timestamp, Client ID, dan Private Key wajib diisi.');
 const data=clientId+'|'+timestamp;$('data').textContent=data;
 const key=await importPrivateKey(pem);
 const bytes=new TextEncoder().encode(data);
 const sig=await crypto.subtle.sign({name:'RSASSA-PKCS1-v1_5'},key,bytes);
 const out=btoa(String.fromCharCode(...new Uint8Array(sig)));
 
 $('output').textContent=out;
 return out;
}

// Kontrol Modal Pop-up
function showModal(text){ 
  $('popupOutput').textContent = text;
  $('popupModal').classList.add('active'); 
}
function hideModal(){ 
  $('popupModal').classList.remove('active'); 
}

// Event Klik Tombol Generate
$('run').onclick=async()=>{
  $('run').disabled=true;
  try{
    const signature = await generate();
    $('status').textContent='✔ Kelar Tuan Baroto';
    
    // Tampilkan pop-up berisi hasil Signature
    showModal(signature);
  }catch(e){
    $('output').textContent='ERROR: '+e.message;
    $('status').textContent='✖ Periksa format private key (PKCS#1/PKCS#8), Client ID, dan Timestamp.';
  }finally{
    $('run').disabled=false;
  }
};

// Event Tombol Dalam Modal
$('modalClose').onclick=()=>{ hideModal(); };

$('modalCopy').onclick=async()=>{
  const val=$('popupOutput').textContent;
  if(val){
    await navigator.clipboard.writeText(val);
    $('status').textContent='✔ Signature berhasil dicopy dari pop-up.';
  }
};

// Event Tombol Copy Utama
$('copy').onclick=async()=>{
  const v=$('output').textContent;
  if(v&&v!=='Belum ada hasil.'&&!v.startsWith('ERROR:')){
    await navigator.clipboard.writeText(v);
    $('status').textContent='✔ Signature berhasil dicopy.';
  }
};
</script>
</body>
</html>
